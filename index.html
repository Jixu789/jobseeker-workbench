     advice:coverPct>=0.6?"关键词已覆盖主流筛选条件。":"优先把缺失技能写进最近一段经历的动作里，而不是堆在技能栏。"},
    {key:"quant",name:"量化成果",pass:withNum>=3,value:withNum+" 条",
     detail:"招聘方与 ATS 都偏好带数字的成果句",
     advice:withNum>=3?"量化密度达标。":"至少补 3 条含数字的成果（比例、金额、人数、时长）。"},
    {key:"verb",name:"动词开头",pass:verbOk>=0.7,value:Math.round(verbOk*100)+"%",
     detail:"每条经历以行为动词开头，可读性更高",
     advice:verbOk>=0.7?"表述动作清晰。":"把“参与了/负责了一些”改成“主导/搭建/推动”等强动词。"},
    {key:"len",name:"篇幅密度",pass:words>=500&&words<=1800,value:words+" 字",
     detail:"一页简历建议 600–1400 字",
     advice:(words>=500&&words<=1800)?"篇幅在合理区间。":(words<500?"内容偏薄，补充与岗位相关的项目细节。":"内容偏长，删掉与目标岗位无关的经历。")},
    {key:"contact",name:"基本信息",pass:contactOk,value:contactOk?"已填":"缺失",
     detail:"手机号或邮箱缺失会导致无法联系",
     advice:contactOk?"联系方式完整。":"补上手机号与邮箱，放在页首。"},
    {key:"fmt",name:"可解析格式",pass:fmtOk,value:fmtOk?"正常":"有风险",
     detail:"避免表格、分栏、文本框，ATS 可能读不出来",
     advice:fmtOk?"纯文本结构，ATS 可正常解析。":"改为单列纯文本，去掉表格与文本框。"}
  ];
}

function trimTo(s,n){ s=String(s||""); return s.length>n? s.slice(0,n)+"…" : s; }

function findBestBullet(res, reqText){

    const s=overlap(b,g); if(s>bs){ bs=s; best={text:b, company:e.company, role:e.role, period:e.period}; }

/* ---------- 一键改写：按岗位整体优化简历 ---------- */
function rwReqSkills(m){
  const p=(m&&m.parsed)||{};
  return {
    must:[...new Set((p.must||[]).flatMap(extractSkills))],
    nice:[...new Set((p.nice||[]).flatMap(extractSkills))]
  };
}
function rwReorderSkills(res,m){
  const {must,nice}=rwReqSkills(m);
  return (res.skills||[]).map((s,i)=>{
    const c=canonSkill(s);
    const r=must.includes(c)?0:(nice.includes(c)?1:2);
    return {s,i,r};
  }).sort((a,b)=>a.r-b.r||a.i-b.i).map(x=>x.s);
}
function rwMatchedSkills(res,m){
  const {must,nice}=rwReqSkills(m);
  const own=(res.skills||[]).map(canonSkill);
  const out=[];
  must.concat(nice).forEach(s=>{ if(own.includes(s)&&!out.includes(s)) out.push(s); });
  return out;
}
function rwTidyBullet(s){
  let t=String(s||"").replace(/\s+/g," ").trim();
  if(!t) return "";
  t=t.replace(/[；;，,、]+$/,"").replace(/。+$/,"");
  return t+"。";
}
function rwProjectScore(p,m){
  const p2=(m&&m.parsed)||{};
  const req=[].concat(p2.must||[],p2.nice||[],p2.duties||[]).join("\n");
  const text=[p.name,p.role,p.stack,p.star?.s,p.star?.t,p.star?.a,p.star?.r].filter(Boolean).join(" ");
  const base=overlap(text,bigrams(req))*100;
  const hit=extractSkills(text).filter(s=>rwReqSkills(m).must.includes(s)).length;
  return base+hit*6;
}
function rwBestResult(res){
  const exp=[], pj=[];
  (res.experience||[]).forEach(e=>(e.bullets||[]).forEach(b=>{ if(/\d/.test(b)) exp.push(b); }));
  (res.projects||[]).forEach(p=>{ if(p.star?.r&&/\d/.test(p.star.r)) pj.push(p.star.r); });
  const pool=exp.length?exp:(pj.length?pj:[]);
  if(!pool.length) return "";
  const rank=s=>/(提升|下降|缩短|增加|减少|达成|节省|挽回|转化|增长)/.test(s)?0:1;
  const best=pool.slice().sort((a,b)=>rank(a)-rank(b)||a.length-b.length)[0];
  let t=String(best).replace(/[；。]$/,"").replace(/\s+/g," ").trim();
  if(t.length>56){
    const cut=t.slice(0,56);
    const i=Math.max(cut.lastIndexOf("，"),cut.lastIndexOf("、"),cut.lastIndexOf("；"));
    t=i>=16?cut.slice(0,i):cut;
  }
  return t;
}

  const br=rwBestResult(res);

  if(y) parts.push(`${y} 年工作经验`);

}

function rwDiff(a,b){

function rwNumbers(s){ return (String(s||"").match(/\d+(?:\.\d+)?/g)||[]); }
function rwNewNumbers(oldText,newText){

function rwMergeAI(base,obj,res){
  const next=structuredClone(base);
  const note=[]; let used=false;
  if(obj&&typeof obj.summary==="string"){
    const s=String(obj.summary).replace(/\s+/g," ").trim().replace(/^[“"'「]+|[”"'」]+$/g,"");
    if(s.length>=20&&s.length<=240){ next.summary=s; used=true; }
    else if(s) note.push("AI 简介长度不合规，保留本地改写");
  }
  if(obj&&Array.isArray(obj.skills)&&(res.skills||[]).length){
    const exact=new Set(res.skills||[]);
    const byCanon=new Map();
    (res.skills||[]).forEach(s=>{ const c=canonSkill(s); if(!byCanon.has(c)) byCanon.set(c,s); });
    const picked=[];
    obj.skills.forEach(s=>{
      const raw=String(s||"").trim();
      if(!raw) return;
      const orig=exact.has(raw)?raw:byCanon.get(canonSkill(raw));
      if(orig&&!picked.includes(orig)) picked.push(orig);
    });
    if(picked.length&&picked.length<=(res.skills||[]).length){
      const rest=(res.skills||[]).filter(s=>!picked.includes(s));
      next.skills=picked.concat(rest); used=true;
    } else if(picked.length) note.push("AI 技能列表超出原有技能，已忽略");
  }
  if(obj&&Array.isArray(obj.experience)){
    let bad=0;
    obj.experience.forEach(it=>{
      const i=+it.index;
      if(!(i>=0&&i<(next.experience||[]).length)) return;
      const old=((res.experience||[])[i]||{}).bullets||[];
      const got=(it.bullets||[]).map(x=>rwTidyBullet(String(x||""))).filter(Boolean);
      if(got.length!==old.length){ bad++; return; }
      const safe=got.map((x,j)=>rwNewNumbers(old[j],x).length?null:x);
      if(safe.some(x=>x===null)){ bad++; return; }
      next.experience[i].bullets=safe; used=true;
    });
    if(bad) note.push(`${bad} 段经历因条数或数字与原文不一致，已保留原句`);
  }
  return {resume:next,note,used};
}
function rwName(src,job){

async function runOneClickRewrite(m,job,res){
  let next=rewriteResumeLocal(res,m,job);
  const ai={ready:aiReady(),used:false,note:[],err:""};
  if(ai.ready){
    try{
      const obj=await aiRewriteResume(res,m,job);
      const r=rwMergeAI(next,obj,res);
      next=r.resume; ai.note=r.note; ai.used=r.used;
    }catch(e){ ai.err=String((e&&e.message)||e).slice(0,80); }
  }
  const diff=rwDiff(res,next);
  if(!diff.length) return null;
  next.id=uid("r"); next.parentId=res.id; next.createdAt=nowISO(); next.updatedAt=nowISO();
  next.name=rwName(res,job);
  data.resumes.unshift(next); data.activeResumeId=next.id; store.save();
  const after=runMatch(job.id,next.id);
  openRewriteResult({src:res,next,before:m,after,diff,ai});
  render();
  return next;
}

function radarOrgOf(company, type){
  const t=String(type||""), n=String(company||"");
  if(/国有|央企|中央企业/.test(t)) return "央企国企";
  if(/民营|私营|个体|股份制|合资|外商独资|上市/.test(t)) return RADAR_BRAND.test(n) ? "大厂" : "私企";

  if(RADAR_BRAND.test(n)) return "大厂";
  if(/研究院|研究所|实验室|设计院/.test(n)) return "央企国企";
  if(/集团|控股|股份/.test(n)) return "私企";

function radarDirOfSegs(tech, ind){

  /* 行业写明材料 / 化工，且标题里也有材料/化工词 → 优先归「材料与化工」，
     避免「半导体材料」「化工自动化」被电子信息 / 自动化先抢走 */
  if(RADAR_MAT_IND.test(industry) && tech.some(s=>RADAR_DIR_RE["材料与化工"].test(s))) return "材料与化工";

async function radarFetch(auto){
  if(RADAR.loading) return;
  RADAR.loading=true; RADAR.error=""; radarRenderPanel();
  try{
    const ctl=new AbortController();
    const tm=setTimeout(()=>ctl.abort(), 30000);
    let res;
    try{ res=await fetch(RADAR_SRC.url,{signal:ctl.signal,cache:"default"}); }
    finally{ clearTimeout(tm); }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();
    const raw=Array.isArray(json)?json:(Array.isArray(json.jobs)?json.jobs:[]);
    const seen=new Set();
    const items=[];
    raw.forEach(row=>{
      const it=radarMapCampus(row);
      if(!it || seen.has(it.rid)) return;
      seen.add(it.rid); items.push(it);
    });
    if(!items.length) throw new Error("源里没有匹配这些方向的岗位");
    RADAR.online=items;
    RADAR.lastAt=items.reduce((a,x)=>x.date&&x.date>a?x.date:a, "")||(json&&json.generatedAt)||nowISO();
    RADAR.selected.clear();
    if(!auto) toast(`抓取到 ${items.length} 条校招岗位，按方向筛一筛`);
  }catch(e){
    RADAR.error=(e && e.name==="AbortError")?"请求超时":((e && e.message)||"网络错误");
    if(!auto) toast("在线抓取失败，已保留内置示例池");
  }finally{
    RADAR.loading=false; radarRenderPanel();
  }
}
function radarImport(items){

    const jd=it.jd||`${it.title}｜${it.company}｜${it.city}\n关键词：${(it.tags||[]).join("、")}`;
    const rec={ id:uid("j"), createdAt:nowISO(), updatedAt:nowISO(),
      title:it.title, company:it.company, location:it.city==="地点未公布"?"":it.city,
      salary:it.salary||"", channel:it.kind?`岗位雷达 · ${it.kind}`:`岗位雷达 · ${it.source||"公开源"}`,
      deadline:it.deadline||"", status:"在投", jd, parsed:parseJD(jd),
      srcUrl:it.url||"", jdPending:!!it.kind, radarKind:it.kind||"" };
    data.jobs.unshift(rec); add++; if(it.kind) ids.push(rec.id);
    if(it.kind) notice++;

function htmlToText(html){
  return String(html||"")
    .replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ")
    .replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|li|h\d|tr|section)>/gi,"\n")
    .replace(/<li[^>]*>/gi,"- ").replace(/<[^>]+>/g," ")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/[ \t\u3000]+/g," ").replace(/\n{3,}/g,"\n\n").trim();

async function fetchArticle(url, ms){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), ms||3500);
  try{
    const r=await fetch(url,{signal:ctl.signal,mode:"cors",credentials:"omit",cache:"no-store"});

    throw e;

const JDW_DUTY=/^(?:岗位|工作|职位|主要|具体)?(?:职责|描述|内容)|^(?:你将负责|你需要做)/;
const JDW_MUST=/^(?:任职|岗位|职位|应聘|招聘|专业|能力|素质|技能)(?:要求|资格|条件)|^我们希望|^加分项|^优先条件/;
const JDW_STOP=/^(?:福利|薪酬|薪资|待遇|公司介绍|关于我们|投递|简历投递|联系我们|工作地点|面试流程|招聘流程|培训|发展通道)/;
function jdwClean(l){
  return String(l||"").replace(/^[\d一二三四五六七八九十]+[.、)．]\s*/,"").replace(/^[-•·*●○▪]\s*/,"").replace(/^[（(]\d+[)）]\s*/,"").trim();
}
function splitDutyMust(text){
  let lines=String(text||"").replace(/\r/g,"").split(/\n+/).map(s=>s.replace(/[ \t\u3000]+/g," ").trim()).filter(Boolean);
  const expanded=[];
  lines.forEach(l=>{
    const m=l.match(/^([^：:]{2,24})[：:]\s*(\S.*)$/);
    if(m && (JDW_DUTY.test(m[1].trim())||JDW_MUST.test(m[1].trim())) && !/(负责|熟悉|精通|了解)/.test(m[1])) expanded.push(m[1].trim(), m[2].trim());
    else expanded.push(l);
  });
  lines=expanded;
  let dutyI=-1, mustI=-1;
  lines.forEach((l,i)=>{
    const t=l.replace(/[:：]\s*$/,"");
    if(t.length<=24 && dutyI<0 && JDW_DUTY.test(t)) dutyI=i;
    if(t.length<=24 && JDW_MUST.test(t) && (dutyI<0||i>dutyI) && mustI<0) mustI=i;
  });
  const grab=(from,to)=>{
    const out=[];
    for(let i=from;i<to;i++){
      const l=jdwClean(lines[i]);
      if(!l) continue;
      if(l.length<=20 && JDW_STOP.test(l)) break;
      if(JDW_DUTY.test(l)||JDW_MUST.test(l)) continue;
      if(l.length<4||l.length>140) continue;
      out.push(l.replace(/[。；;]\s*$/,""));
      if(out.length>=12) break;
    }
    return out;
  };
  let duties=[], must=[];
  if(dutyI>=0) duties=grab(dutyI+1, mustI>dutyI?mustI:lines.length);
  if(mustI>=0){
    let end=lines.length;
    for(let i=mustI+1;i<lines.length;i++){ if(lines[i].length<=20&&JDW_STOP.test(lines[i])){ end=i; break; } }
    if(dutyI>mustI && dutyI<end) end=dutyI;   // 「要求」写在「职责」之前时，到职责标题就截断
    must=grab(mustI+1, end);
  }
  if(!duties.length){
    duties=lines.map(jdwClean).filter(l=>l.length>=6&&l.length<=140&&/(负责|参与|协助|完成|推动|搭建|设计|开发|维护|跟进|支持|制定)/.test(l)).slice(0,10);
  }
  if(!must.length){
    must=lines.map(jdwClean).filter(l=>l.length>=6&&l.length<=140&&/(熟悉|精通|掌握|具备|熟练|以上|学历|专业|优先|加分|本科|硕士|大专)/.test(l)).slice(0,10);
  }
  const uniq=a=>[...new Set(a)];
  return {duties:uniq(duties),must:uniq(must)};
}

    <div class="jw-nav" style="margin-top:4px">

      <button class="btn line sm" id="jw-skip">跳过这条</button>
      <span class="spacer"></span>
      <button class="btn line sm" id="jw-close">关闭</button>

  const st=modal.querySelector("#jw-status"), ta=modal.querySelector("#jw-text");

  const auto=modal.querySelector("#jw-auto"); if(auto) auto.onclick=()=>jdwAuto(ov);
  ta.oninput=()=>{
    clearTimeout(ov.__tm);

  };
  modal.querySelector("#jw-save").onclick=()=>jdwSave(ov);
  modal.querySelector("#jw-skip").onclick=()=>{ JDW.idx++; if(JDW.idx>=JDW.ids.length) jdwDone(ov); else jdwRender(ov); };
  modal.querySelector("#jw-close").onclick=()=>ov.remove();
  ["#jw-duty","#jw-must"].forEach(s=>{

  if(url) jdwAuto(ov);

}
async function jdwAuto(ov){
  const job=getJob(JDW.ids[JDW.idx]); if(!job) return;
  const url=jobSrcUrl(job), st=ov.querySelector("#jw-status"), token=JDW.token;
  if(!url||!st) return;
  st.textContent="正在直连抓取原文…";
  try{
    const text=await fetchArticle(url, 3500);
    if(token!==JDW.token||!document.body.contains(ov)) return;
    if(!text||text.length<160) throw new Error("页面没有可读正文（可能是图片公告）");
    const ta=ov.querySelector("#jw-text");
    if(ta && !ta.value.trim()) ta.value=text.slice(0,12000);
    jdwParse(ov);
    const s0=ov.querySelector("#jw-status");
    if(s0) s0.textContent="已自动抓取正文，核对两栏后保存";
  }catch(e){
    if(token!==JDW.token||!document.body.contains(ov)) return;
    const s=ov.querySelector("#jw-status");
    if(s) s.textContent=`直连抓取失败：${(e&&e.message)||"网络错误"} · 请点「打开原文」后复制正文粘贴`;
  }
}
function jdwParse(ov){
  const ta=ov.querySelector("#jw-text"), d=ov.querySelector("#jw-duty"), m=ov.querySelector("#jw-must");
  if(!ta||!d||!m) return;
  const text=ta.value.trim();
  if(text.length<30) return;
  const r=splitDutyMust(text);
  const set=(el,arr)=>{
    const next=arr.join("\n");
    if(el.value.trim() && el.value!==(el.dataset.auto||"")) return;   // 用户手改过的两栏不覆盖
    el.value=next;
    if(next) el.dataset.auto=next; else delete el.dataset.auto;
  };
  set(d,r.duties); set(m,r.must);
  const st=ov.querySelector("#jw-status");
  if(st) st.textContent=`识别出 ${r.duties.length} 条职责 / ${r.must.length} 条要求${(!r.duties.length&&!r.must.length)?" · 没找到小标题，可手动补":""}`;
}
function jdwLines(v){
  return String(v||"").split(/\n+/).map(s=>s.replace(/^[\d一二三四五六七八九十]+[.、)．]\s*/,"").replace(/^[-•·*]\s*/,"").trim()).filter(Boolean).slice(0,20);
}
function jdwSave(ov){
  const job=getJob(JDW.ids[JDW.idx]); if(!job) return;
  const text=(ov.querySelector("#jw-text")||{}).value||"";
  const duty=jdwLines((ov.querySelector("#jw-duty")||{}).value);
  const mustAll=jdwLines((ov.querySelector("#jw-must")||{}).value);
  if(!text.trim()&&!duty.length&&!mustAll.length){ toast("先粘贴公告正文，或直接填两栏"); return; }
  const body=(text.trim()||job.jd||"").slice(0,12000);
  const p=parseJD(body);
  p.duties=duty.length?duty:(p.duties||[]);
  const nice=[...new Set([...(p.nice||[]),...mustAll.filter(t=>/优先|加分|更佳/.test(t))])];
  p.must=mustAll.length?mustAll.filter(t=>!/优先|加分|更佳/.test(t)):(p.must||[]);
  p.nice=nice;
  job.jd=body; job.parsed=p; job.jdFilled=nowISO(); delete job.jdPending; job.updatedAt=nowISO();
  store.save();
  JDW.idx++;
  if(JDW.idx>=JDW.ids.length) jdwDone(ov, JDW.ids.length);
  else { render(); jdwRender(ov); }
}
function jdwDone(ov, done){
  if(ov&&ov.remove) ov.remove();
  render();
  const left=pendingJobs().length;
  toast(done?`补 JD 完成：${done} 条`:(left?`还剩 ${left} 条待补`:"补 JD 已完成"));
}

function isApplied(j){ return !!(j && (j.appliedAt || (j.applyLog && j.applyLog.length))); }
/* ---------------- 行业归类 ----------------
   雷达加入的岗位带公告源的行业字段（如「IT/互联网/游戏」），手动建的岗位没有。
   统一走这里：先看原始行业标签，再看公司 / 岗位 / JD 里的关键词，最后归「其他」。 */
const IND_OTHER="其他";
const INDUSTRY_RULES=[
  ["互联网/软件",/互联网|软件|电商|云计算|SaaS|游戏|社交|平台|人工智能|大数据|信息技术|计算机|\bIT\b/i],
  ["电子/半导体",/半导体|芯片|集成电路|电子|元器件|光电|光学|PCB|硬件/i],
  ["通信",/通信|运营商|5G|网络设备|光通信|华为|中兴/i],
  ["汽车",/汽车|整车|车载|自动驾驶|新能源车|主机厂/i],
  ["制造/机械",/制造|机械|装备|重工|工业|机床|机器人|精密|自动化/i],
  ["能源/化工",/能源|电力|电网|石化|化工|材料|新能源|电池|光伏|风电|环保|冶金/i],
  ["医药/医疗",/医药|医疗|生物|制药|器械|医院|健康|基因/i],
  ["金融",/金融|银行|证券|保险|基金|支付|资管|风控/i],
  ["教育",/教育|学校|培训|院校|学院|教师/i],
  ["建筑/地产",/建筑|地产|房地产|工程|设计院|施工|物业|建材/i],
  ["消费/零售",/消费品|零售|快消|食品|饮料|日化|服装|门店|餐饮/i],
  ["交通/物流",/物流|运输|航空|铁路|快递|供应链|仓储/i],
  ["咨询/服务",/咨询|会计|审计|律所|人力|外包|专业服务|广告|传媒/i],
];
function industryOf(j){
  if(!j) return IND_OTHER;
  const raw=String(j.industry||"");
  if(raw===IND_OTHER) return IND_OTHER;   // 手动选过「其他」就不要再被关键词改判
  for(const [name,re] of INDUSTRY_RULES) if(re.test(raw)) return name;
  if(raw && !INDUSTRY_RULES.some(([,re])=>re.test(raw))) return raw.slice(0,12);
  const scope=`${j.company||""} ${j.title||""} ${String(j.jd||"").slice(0,400)}`;
  for(const [name,re] of INDUSTRY_RULES) if(re.test(scope)) return name;
  return IND_OTHER;
}

          indFilter!=="all" ? "查看全部行业" : (jobFilter==="applied"?"查看全部岗位":"新建岗位"),
          indFilter!=="all" ? "ind-all" : (jobFilter==="applied"?"jf-all":"new-job")));
  wireJobs();
  if(!RADAR.online.length && !RADAR.loading && !RADAR.tried && navigator.onLine!==false){
    RADAR.tried=true; radarFetch(true);
  }

/* ---------------- 一键投递 ----------------
   单文件网页无法代替你在官网上提交（跨域 + 需要登录），所以这里做的是：
   1) 尽最大可能在本地找出「官网 / 公告原文」链接，一次点击直接打开；
   2) 没有链接时给出填写链接、按公司+岗位搜索、复制投递素材三条出路；
   3) 无论走哪条，都记一笔投递时间与入口，岗位库可按「已投递」筛。
*/
const APPLY_URL_RE=/https?:\/\/[^\s"'<>()（）【】\]]+/i;
function applyLinkOf(j){
  const list=[["官网链接",j.url],["公告原文",j.srcUrl],["公告原文",j.applyUrl]];
  for(const [kind,v] of list){
    const s=String(v||"").trim();
    if(/^https?:\/\//i.test(s)) return {url:s, kind};
  }
  const m=String((j&&j.jd)||"").match(APPLY_URL_RE);
  if(m) return {url:m[0].replace(/[.,;，。；、]+$/,""), kind:"JD 里的链接"};
  return null;
}
function applySearchURL(j){
  const q=[j.company,j.title,"官网","招聘","投递"].filter(Boolean).join(" ");
  return "https://cn.bing.com/search?q="+encodeURIComponent(q);
}
function applyMaterial(j){
  const res=activeResume();
  const m=res?runMatch(j.id,res.id):null;
  const p=j.parsed||parseJD(j.jd||"");
  const cover=m?`匹配分 ${m.score} / 要求覆盖 ${Math.round(m.coverage*100)}%`:"尚未做匹配分析";
  const hit=(m&&m.matchedSkills&&m.matchedSkills.length)?m.matchedSkills.slice(0,6).join("、"):(p.skills||[]).slice(0,6).join("、");
  return [
    `【投递素材】${j.company||"未填公司"} · ${j.title||"未填岗位"}`,
    `${cover}${hit?`｜匹配点：${hit}`:""}`,
    res&&res.summary?`个人简介：${res.summary}`:"",
    `投递时间：${new Date().toLocaleString("zh-CN")}`,
    "（粘贴到官网表单的「自我评价 / 备注」栏；数字与事实以简历原文为准）",
  ].filter(Boolean).join("\n");
}
function markApplied(j, url, method){
  j.applyLog=j.applyLog||[];
  j.applyLog.unshift({at:nowISO(), url:url||"", method:method||"官网"});
  j.applyLog=j.applyLog.slice(0,20);
  j.appliedAt=j.applyLog[0].at;
  j.applyUrl=url||"";
  j.applyMethod=method||"官网";
  j.status="已投递";
  store.save();
}

    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="ap-cancel">关闭</button></div>`, true);

      window.open(url,"_blank","noopener,noreferrer");
      markApplied(j, url, j.url?"官网":"公告原文");
      ov.remove(); render();
      toast("已打开投递页，并按「已投递」记了一笔");
    };
    return;
  }
  if(!confirm(`打开「${j.company}」官网投递页？\n${target.url}`)) return;
  window.open(target.url,"_blank","noopener,noreferrer");
  markApplied(j, target.url, target.kind);
  render();

}

  ov.querySelectorAll(".seg .opt").forEach(o=>o.onclick=()=>{ ov.querySelectorAll(".seg .opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); });
  const indSel=ov.querySelector("#jf-ind"), indAuto=indSel.options[0];
  const refreshInd=()=>{ indAuto.textContent=`自动判断（${industryOf({industry:(job&&job.industry)||"",company:ov.querySelector("#jf-company").value,title:ov.querySelector("#jf-title").value,jd:ov.querySelector("#jf-jd").value})}）`; };
  ["#jf-title","#jf-company","#jf-jd"].forEach(s=>ov.querySelector(s).addEventListener("input",refreshInd));
  ["#jf-duty","#jf-must"].forEach(s=>{

  });

    const r=autofillJob(text,ov);
    const u=ov.querySelector("#jf-url");
    if(u && !u.value.trim()){
      const m=text.match(APPLY_URL_RE);
      if(m){ u.value=m[0].replace(/[.,;，。；、]+$/,""); r.n++; }

    toast(r.n ? `已回填 ${r.n} 个空栏，请核对`
      : r.detected ? "没有空栏可填，已填内容不会被覆盖"

  };
  ov.querySelector("#jf-cancel").onclick=()=>ov.remove();
  ov.querySelector("#jf-save").onclick=()=>{
    const val=id=>ov.querySelector(id).value;
    const linesOf=sel=>String(val(sel)||"").split(/\r?\n/)
      .map(s=>s.replace(/^[\d一二三四五六七八九十]+[.、)．]\s*/,"").replace(/^[-•·*]\s*/,"").trim())
      .filter(Boolean);
    const title=val("#jf-title").trim(), jd=val("#jf-jd").trim();
    const duty=linesOf("#jf-duty"), must=linesOf("#jf-must");
    if(!title){ toast("先填岗位名称"); return; }
    const src=[jd,duty.join("\n"),must.join("\n")].filter(Boolean).join("\n");
    if(src.length<20){ toast("JD 太短了，复制完整一点更准"); return; }
    const parsed=parseJD(jd||src);
    if(duty.length) parsed.duties=duty;
    if(must.length) parsed.must=must;
    const rec=job||{id:uid("j"),createdAt:nowISO()};
    Object.assign(rec,{title,company:val("#jf-company").trim()||"未填公司",location:val("#jf-loc").trim(),
      salary:val("#jf-salary").trim(),channel:val("#jf-channel").trim(),deadline:val("#jf-deadline"),
      url:val("#jf-url").trim(),
      industry:val("#jf-ind").trim()||(job&&job.industry)||"",
      status:ov.querySelector("#jf-status .on")?.dataset.v||"在投",jd,parsed,updatedAt:nowISO()});
    if(!job) data.jobs.unshift(rec);
    data.activeJobId=rec.id; store.save(); ov.remove();
    toast(`已解析 ${parsed.must.length} 条硬性要求 / ${parsed.nice.length} 条加分项`); render();
  };
}

function serExperiences(list){
  return (list||[]).map(e=>[e.company||"",e.role||"",e.period||"",(e.bullets||[]).join("；")].join("｜")).join("\n");
}
function parseExperiences(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split("｜").map(s=>s.trim());
    return {company:p[0]||"",role:p[1]||"",period:p[2]||"",
      bullets:(p[3]||"").split(/[；;]/).map(s=>s.trim()).filter(Boolean)};
  });
}
function serProjects(list){
  return (list||[]).map(p=>[p.name||"",p.role||"",p.stack||"",p.star?.s||"",p.star?.a||"",p.star?.r||""].join("｜").replace(/[｜\s]+$/,"")).join("\n");

function parseProjects(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split("｜").map(s=>s.trim());
    return {name:p[0]||"",role:p[1]||"",stack:p[2]||"",star:{s:p[3]||"",t:"",a:p[4]||"",r:p[5]||""}};
  });

  /* 技能栏缺失时，用项目技术栈里的英文技术名词兜底（STM32 / FreeRTOS / React …） */
  if(!out.skills.length){
    const stack=(out.projects||[]).map(p=>(p.stack||"")+" "+(p.name||"")).join(" ");

    stack.split(/[\/·,，、;；|\s]+/).map(s=>s.trim())
      .filter(s=>/^[A-Za-z][A-Za-z0-9+#.]{1,19}$/.test(s)&&!/^(19|20)\d{2}$/.test(s))
      .forEach(s=>{ if(!seen.has(s)){ seen.add(s); out.skills.push(s); } });
    out.skills=out.skills.slice(0,10);
  }
  out.education=rvParseEdu(B.education,text);
  out.honor=rvParseHonor(B.honors);
  return out;
}

function guessYears(text){
  const src=String(text||"");
  const m=src.match(/(?<!\d)(\d{1,2})\s*年(?:以上|及以上|\+)?[^\n。；，]{0,8}?经验/);
  if(m) return Math.min(40,+m[1]);
  const seg=(src.split(/(?:工作经历|工作经验|职业经历)/)[1]||"")
    .split(/(?:项目经历|项目经验|教育经历|教育背景|专业技能|核心技能|自我评价|技能特长)/)[0];
  const ys=[...seg.matchAll(/(?:19|20)\d{2}/g)].map(x=>+x[0]).filter(y=>y>1980&&y<=new Date().getFullYear()+1);
  if(ys.length>=2){ const span=Math.max(...ys)-Math.min(...ys); if(span>0&&span<=40) return span; }
  return 0;
}
function guessName(text){
  const roleRe=/(经理|工程师|分析师|设计师|运营|销售|专员|主管|总监|助理|实习|顾问|架构师|开发|产品|简历|求职)/;
  const lines=String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,5);
  for(const raw of lines){
    const l=raw.replace(/\s*(个人)?简历\s*$/,"").replace(/^(姓名|Name)[：:\s]*/i,"").trim();
    if(!l||roleRe.test(l)||/[：:|｜@\d]/.test(l)) continue;
    if(/^[\u4e00-\u9fa5]{2,4}$/.test(l)) return l;
    if(/^[A-Z][a-zA-Z]+(?:\s[A-Z][a-zA-Z]+){1,2}$/.test(l)) return l;
  }
  return "";
}

function fallbackCopy(t,done){

    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), cmtLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder("utf-8").decode(u8.subarray(p+46,p+46+nameLen));
    if(name===want){
      const ln=dv.getUint16(lho+26,true), le=dv.getUint16(lho+28,true);
      const start=lho+30+ln+le;
      return { method, data:u8.subarray(start,start+csize) };
    }
    p+=46+nameLen+extraLen+cmtLen;
  }
  return null;
}
async function docxToText(buf){
  const e=zipFindEntry(buf,"word/document.xml");
  if(!e) throw new Error("DOCX 里没找到正文，可能是旧版 .doc，请另存为 .docx");
  let xml;
  if(e.method===0) xml=new TextDecoder("utf-8").decode(e.data);
  else if(e.method===8) xml=new TextDecoder("utf-8").decode(await inflateBytes(e.data,"deflate-raw"));
  else throw new Error("这份 DOCX 的压缩方式暂不支持");
  return xmlToText(xml);
}
function xmlToText(xml){
  return String(xml)
    .replace(/<w:tab[^>]*\/>/g,"\t")
    .replace(/<w:br[^>]*\/>/g,"\n")
    .replace(/<\/w:p>/g,"\n")
    .replace(/<[^>]+>/g,"")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&amp;/g,"&")
    .replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
/* --- PDF：解压 FlateDecode 内容流，提取 Tj / TJ 文本（仅文字层） --- */
function pdfLiteral(s){
  return s.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g,(m,g)=>{
    if(/^[0-7]+$/.test(g)) return String.fromCharCode(parseInt(g,8));
    return { n:"\n", r:"\r", t:"\t", b:"\b", f:"\f", "(":"(", ")":")", "\\":"\\" }[g]||g;
  });
}
function pdfHex(s){
  const h=s.replace(/\s+/g,""), bytes=[];
  for(let i=0;i<h.length;i+=2){ const v=parseInt(h.substr(i,2),16); if(!isNaN(v)) bytes.push(v); }
  if(bytes.length>3 && bytes[0]===0xFE && bytes[1]===0xFF){
    let out="";
    for(let i=2;i+1<bytes.length;i+=2) out+=String.fromCharCode((bytes[i]<<8)|bytes[i+1]);
    return out;
  }
  return bytes.map(b=>String.fromCharCode(b)).join("");
}
function pdfContentText(src){
  const out=[];
  const blocks=src.match(/BT[\s\S]*?ET/g)||[];
  blocks.forEach(b=>{
    const re=/(\((?:\\.|[^\\()])*\))|(<[0-9A-Fa-f\s]*>)|(Tj|TJ|T\*|Td|TD|Tm|'|")/g;
    let pend=[], line="", mm;
    while((mm=re.exec(b))){
      if(mm[1]) pend.push(pdfLiteral(mm[1].slice(1,-1)));
      else if(mm[2]) pend.push(pdfHex(mm[2].slice(1,-1)));
      else{
        const op=mm[3];
        if(op==="Tj"||op==="TJ"||op==="'"||op==='"' ){
          line+=pend.join(""); pend=[];
          if(op==="'"||op==='"'){ out.push(line); line=""; }
        }else{
          if(line.trim()) out.push(line);
          line=""; pend=[];
        }
      }
    }
    if(line.trim()) out.push(line);
  });
  return out.join("\n");
}
async function pdfToText(buf){
  const u8=new Uint8Array(buf);
  const latin=new TextDecoder("latin1").decode(u8);
  const chunks=[];
  const re=/stream\r?\n/g;
  let m;
  while((m=re.exec(latin))){
    const start=m.index+m[0].length;
    const end=latin.indexOf("endstream",start);
    if(end<0) break;
    const dictStart=Math.max(0,latin.lastIndexOf("<<",m.index));
    const dict=latin.slice(dictStart,m.index);
    if(!/FlateDecode/.test(dict)){ re.lastIndex=end; continue; }
    let data=u8.subarray(start,end);
    while(data.length && (data[data.length-1]===10 || data[data.length-1]===13)) data=data.subarray(0,data.length-1);
    try{
      const decoded=await inflateBytes(data,"deflate");
      const txt=pdfContentText(new TextDecoder("latin1").decode(decoded));
      if(txt.trim()) chunks.push(txt);
    }catch(e){ /* 跳过不能解压的对象 */ }
    re.lastIndex=end+9;
  }
  return chunks.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
function textLooksBad(t){
  const s=String(t||"").replace(/\s/g,"");
  if(s.length<20) return true;
  const bad=(s.match(/[\uFFFD\u0000-\u0008\u000e-\u001f]/g)||[]).length;
  if(bad/Math.max(1,s.length)>0.02) return true;
  const cjk=(s.match(/[\u4e00-\u9fa5]/g)||[]).length;
  return cjk===0 && s.length>150 && /[\u0080-\u00ff]/.test(s);
}
/* --- 图片：有 API 用视觉模型转录，没有则给提示词让用户自己识别 --- */
function fileToDataURL(file){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=()=>ok(r.result);
    r.onerror=()=>no(new Error("图片读取失败"));
    r.readAsDataURL(file);
  });
}
async function compressImage(file,maxSide){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{
      const i=new Image();
      i.onload=()=>ok(i);
      i.onerror=()=>no(new Error("图片无法解码"));
      i.src=url;
    });
    const ratio=Math.min(1, maxSide/Math.max(img.width,img.height));
    if(ratio>=1 && file.size<1.6*1024*1024) return await fileToDataURL(file);
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*ratio));
    c.height=Math.max(1,Math.round(img.height*ratio));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.86);
  } finally { URL.revokeObjectURL(url); }
}
function imagePrompt(kind){
  const what=kind==="jd" ? "岗位 JD" : "个人简历";
  return `请把这张图片里的${what}逐字转录成纯文本。要求：

async function imageToText(file,kind){

    ] }
  ]);
  return String(txt||"").trim();
}
async function extractFile(file, kind){
  const ext=fileExt(file.name), type=file.type||"";
  if(/^image\//.test(type) || ["png","jpg","jpeg","webp","bmp"].includes(ext)){
    if(!aiReady()) return { text:"", from:"图片", needAI:true,
      note:"图片需要 AI 识别。当前没配置 API：点下面按钮复制提示词，交给你常用的 AI 看图转录，再把文字粘回来。" };
    const t=await imageToText(file,kind);
    return { text:t, from:"图片 · AI 识别", note:t?"AI 已转录，请逐字核对（尤其是数字和公司名）：":"AI 没有返回内容，可以重试或直接粘贴文本。" };
  }
  if(ext==="doc") throw new Error("旧版 .doc 浏览器读不了，请另存为 .docx 或 PDF");
  if(ext==="docx") return { text:await docxToText(await readAsArrayBuffer(file)), from:"Word(.docx) · 本地提取" };
  if(ext==="pdf"){
    const t=await pdfToText(await readAsArrayBuffer(file));
    if(textLooksBad(t)) return { text:t, from:"PDF · 本地提取", warn:true,
      note:"这份 PDF 的文字层不完整（扫描件或嵌入字体），下面可能是乱码。建议改用截图上传做图片识别，或在 PDF 里全选复制粘贴。" };
    return { text:t, from:"PDF · 本地提取" };
  }
  if(["txt","md","markdown","csv"].includes(ext) || /^text\//.test(type)){
    return { text:(await file.text()).trim(), from:"文本文件" };
  }
  throw new Error("暂不支持这种格式，请用 .docx / .pdf / 图片 / .txt");
}
/* --- 交互：选择文件、拖拽、预览确认 --- */
function pickFile(cb){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=IMPORT_ACCEPT; inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files && inp.files[0];
    inp.remove();
    if(f) cb(f);
  };
  inp.click();
}
function wireImport(btnSel, taSel, kind, ov){
  const btn=ov.querySelector(btnSel), ta=ov.querySelector(taSel);
  if(!btn || !ta) return;
  btn.onclick=()=>pickFile(f=>runImport(f,kind,ta,ov));
  ta.addEventListener("dragover",e=>{ e.preventDefault(); ta.classList.add("ta-drop"); });
  ta.addEventListener("dragleave",()=>ta.classList.remove("ta-drop"));
  ta.addEventListener("drop",e=>{
    e.preventDefault(); ta.classList.remove("ta-drop");
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) runImport(f,kind,ta,ov);
  });
}
async function runImport(file, kind, ta, parentOv){
  const label=kind==="jd" ? "JD" : "简历";
  const status=parentOv.querySelector(".import-status");

  if(file.size>8*1024*1024){ toast("文件超过 8MB，先压缩或截图再传"); return; }
  setStatus(`正在读取 ${file.name}（${fmtSize(file.size)}）…`, true);

  try{ r=await extractFile(file,kind); }

}

  const jsel=$("#m-job"), rsel=$("#m-res");
  if(jsel) jsel.onchange=()=>{ data.activeJobId=jsel.value; store.save(); render(); };
  if(rsel) rsel.onchange=()=>{ data.activeResumeId=rsel.value; store.save(); render(); };
  const rr=$("#m-rerun"); if(rr) rr.onclick=()=>{ toast("已重新诊断"); render(); };
  const atop=$("#m-ai-top"), ai=$("#m-ai");
  if(atop) atop.onclick=()=>openPromptStudio("match_explain");
  if(ai) ai.onclick=()=>openPromptStudio("rewrite_bullets");
  $("#screen").querySelectorAll(".js-acc").forEach(cb=>cb.onchange=()=>{
    cb.checked? accSet.add(cb.dataset.id) : accSet.delete(cb.dataset.id);
    const c=$("#acc-count"); if(c) c.textContent=accSet.size;
  });
  $("#screen").querySelectorAll(".js-copy-sug").forEach(b=>b.onclick=()=>{
    const s=sugs.find(x=>x.id===b.dataset.id); if(s) copyText(s.after);
  });
  const safe=$("#m-accept-safe"); if(safe) safe.onclick=()=>{
    sugs.forEach(s=>{ if(!s.needsEvidence) accSet.add(s.id); });
    toast(`已勾选 ${accSet.size} 条低风险建议`); render();
  };
  const ap=$("#m-apply"); if(ap) ap.onclick=()=>{
    const list=sugs.map(s=>({...s, accepted:accSet.has(s.id)}));
    const next=applySuggestions(list);
    if(next){ accSet.clear(); toast("已生成定制版并设为当前简历"); render(); }
  };
  const rw=$("#m-rewrite"); if(rw) rw.onclick=async()=>{
    const old=rw.innerHTML;
    rw.disabled=true; rw.textContent=aiReady()?"一键改写中（含 AI）…":"一键改写中…";
    try{
      const next=await runOneClickRewrite(m,job,res);
      toast(next?"已生成定制版并设为当前简历":"这份简历已经贴合该岗位，没有可改写的地方");
    }catch(e){
      toast("改写失败："+((e&&e.message)||e));
    }finally{
      rw.disabled=false; rw.innerHTML=old;
    }
  };
  const vw=$("#m-view"); if(vw) vw.onclick=()=>openResumePreview(getResume(data.activeResumeId)||res);
  $("#screen").querySelectorAll(".js-use-res").forEach(b=>b.onclick=()=>{
    data.activeResumeId=b.dataset.id; store.save(); render();
  });
}

function aiCtx(){
  const job = activeJob(), res = activeResume();
  let m = null;
  if(job && res) { try { m = runMatch(job.id,res.id); } catch(e){} }
  const s = data.interview;
  let transcript = "";
  if(s && (s.answers||[]).length){
    transcript = s.answers.map((a,i)=>`Q${i+1}（${a.tag}）：${a.q}\nA：${a.text}\n得分：${a.ev.total}`).join("\n\n");
  }
  return { job, res, match:m, transcript };
}
function parseJSON(text){
  let t = String(text||"").trim();
  t = t.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a>=0 && b>a) t = t.slice(a,b+1);
  try { return JSON.parse(t); } catch(e){ return null; }
}
async function aiChat(messages, opt){
  const cfg = data.settings || {};
  if(!cfg.apiKey) throw new Error("未配置 API Key");
  if(!cfg.baseUrl) throw new Error("未配置接口地址");
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), 45000);
  try{
    const res = await fetch(String(cfg.baseUrl).replace(/\/+$/,"") + "/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.apiKey },
      body:JSON.stringify(Object.assign({
        model: cfg.model || "gpt-4o-mini",
        messages,
        temperature: 0.5
      }, opt&&opt.json ? { response_format:{ type:"json_object" } } : {})),
      signal: ctrl.signal
    });
    if(!res.ok){
      const body = await res.text();
      throw new Error("HTTP " + res.status + " · " + body.slice(0,140));
    }
    const j = await res.json();
    return ((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"").trim();
  } finally { clearTimeout(tm); }
}
function aiReady(){ return !!(data.settings && data.settings.engine==="api" && data.settings.apiKey); }
function downloadText(name, text, mime){
  const blob = new Blob([text], {type: mime||"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 600);
}

      + `<div class="flex mt12"><button class="btn sm" id="ai-add-reverse">加入反问清单</button></div>`;
  }
  if(obj.scores){
    return `<div class="score-grid">${DIM_KEYS.map(k=>`<div class="sc"><div class="k">${DIM_NAMES[k]}</div>
      <div class="v">${obj.scores[k]??"—"}<small style="font-size:11px;color:var(--text-secondary)"> /25</small></div></div>`).join("")}</div>
      <div class="mt12"><span class="badge ${obj.total>=75?'ok':'warn'}">本题 ${obj.total??"—"} 分</span></div>
      <div class="mt8"><b>好的地方：</b>${esc(obj.good||"—")}</div>

  return `<pre class="tiny" style="white-space:pre-wrap;background:var(--surface-nested);padding:12px;border-radius:8px">${esc(JSON.stringify(obj,null,2))}</pre>`;

function openPromptStudio(key){

    </div>
    <label class="mt18" style="display:block;font-size:12px;font-weight:700">AI 返回结果（粘贴回来解析）</label>

    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="ps-close">关闭</button></div>`, true);

      const r = await aiChat([
        {role:"system", content:"你是严谨的求职顾问，只输出 JSON，不要额外解释。"},

/* 备份正文：永远剔除 API Key，避免把密钥随文件发出去 */
function exportPayload(){
  const clone = JSON.parse(JSON.stringify(data));
  if(clone.settings) delete clone.settings.apiKey;
  clone.__meta = { app:"jobseeker-workbench", v:1, at:new Date().toISOString(), profile:activeProfile().name };
  return clone;
}
function markExported(){
  data.settings.lastExportAt = new Date().toISOString();
  store.save();
}
function importPayload(obj){
  if(!obj || !Array.isArray(obj.jobs)) return false;
  delete obj.__meta;
  if(obj.settings) delete obj.settings.apiKey;
  const keepKey = (data.settings && data.settings.apiKey) || "";
  data = obj;
  ensureShape();
  data.settings.privacyAck = true;
  if(keepKey){ data.settings.apiKey = keepKey; data.settings.engine = "api"; }
  store.save();
  return true;
}
function b64enc(u8){
  let s = "";
  for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
  return btoa(s);
}
function b64dec(str){
  const bin = atob(str); const u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function deriveKey(pw, salt, iter){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), { name:"PBKDF2" }, false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:iter, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptBackup(pw){
  if(!(window.crypto && crypto.subtle)) throw new Error("当前浏览器不支持加密，请改用明文备份");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, 150000);
  const plain = new TextEncoder().encode(JSON.stringify(exportPayload()));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, plain);
  return { app:"jobseeker-workbench", enc:"AES-256-GCM", v:1, at:new Date().toISOString(),
    kdf:{ name:"PBKDF2", hash:"SHA-256", iter:150000, salt:b64enc(salt) },
    iv:b64enc(iv), data:b64enc(new Uint8Array(ct)) };
}
async function decryptBackup(obj, pw){
  if(!(window.crypto && crypto.subtle)) throw new Error("当前浏览器不支持解密");
  const iter = (obj.kdf && obj.kdf.iter) || 150000;
  const key = await deriveKey(pw, b64dec(obj.kdf.salt), iter);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64dec(obj.iv) }, key, b64dec(obj.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

  const duty = (parsed.duties||[])[0];
  if(duty) qs.push({id:"q-b2",tag:"行为面",step:"behavioral",text:`这个岗位要「${String(duty).replace(/^[\d.、]+/,"")}」，讲一次你做类似事情的完整过程。`,intent:"把岗位职责翻译成你的行为证据。"});

  qs.push({id:"q-s1",tag:"压力面",step:"pressure",text:`你觉得自己最弱的一点是什么？如果我说你只有 ${m.yOwn} 年经验、离这个岗位还差一点，你怎么回应？`,intent:"看抗压和自我认知。不要辩解，给证据和补法。"});
  qs.push({id:"q-end",tag:"收尾",step:"candidate_questions",reverse:true,text:"我的问题问完了。你还有什么想问我的吗？",intent:"反问环节——问什么，比问不问更重要。"});
  return qs;
}

function evaluateAnswer(text,q,job,res){
  const t = String(text||"").trim();
  const n = t.replace(/\s/g,"").length;
  const parsed = (job&&job.parsed) || parseJD(job&&job.jd);
  const kws = [...new Set([].concat(parsed.skills||[], (parsed.must||[]).flatMap(extractSkills)))];
  const hit = kws.filter(k=>t.toLowerCase().includes(String(k).toLowerCase())).length;

  const content = clamp(Math.round(hit/Math.max(3,kws.length)*18 + Math.min(7,n/60*7)),0,25);
  const sRe=[/当时|背景|情况|问题|挑战|一开始|起因/,/目标|任务|我负责|要我|需要/,/我先|然后|接着|于是|做法|方案|步骤|拆/,/结果|最终|最后|提升了|降低|带来了|节省/];
  const sHit = sRe.filter(re=>re.test(t)).length;
  const structure = clamp(Math.round(sHit/4*18 + (/首先|其次|最后|因为|所以|但是|因此|于是/.test(t)?7:0)),0,25);
  const nums = (t.match(/\d+(\.\d+)?%?/g)||[]).length;
  const evidence = clamp(Math.round(Math.min(1,nums/4)*16 + (/我(负责|主导|牵头|推动|搭建|设计|独立)/.test(t)?9:0)),0,25);
  let expression = 12;
  if(n>=80) expression += 6;
  if(n>=150) expression += 4;
  if(n>520) expression -= 8;
  if(n<40) expression -= 6;
  if(/(嗯|那个|就是|然后就是|差不多)/.test(t)) expression -= 3;
  expression = clamp(expression,0,25);

  const dims = {content,structure,evidence,expression};
  const total = Math.round((content*.35 + structure*.25 + evidence*.25 + expression*.15)/25*100);
  const tips = [];
  if(n<60) tips.push("回答太短，面试官拿不到判断依据。用「背景一句 → 我的动作两句 → 结果一句」补到 150 字以上。");
  if(n>520) tips.push("太长了。先给结论再展开，控制在两分钟内。");
  if(nums===0) tips.push("一个数字都没有。补上比例、金额、人数或时长，哪怕是区间估计。");
  if(sHit<3) tips.push("结构不完整。按 STAR 说：当时什么情况、你要解决什么、你做了什么、结果怎样。");
  if(hit===0 && kws.length) tips.push(`没有主动提到岗位关键词，建议自然带出 ${kws.slice(0,3).join(" / ")}。`);
  if(!/我(负责|主导|牵头|推动|搭建|设计|独立)/.test(t)) tips.push("通篇在说「我们」，听不出你个人做了什么，换成「我负责…」。");
  return {dims,total,tips,star:{s:sRe[0].test(t),t:sRe[1].test(t),a:sRe[2].test(t),r:sRe[3].test(t)},nums,len:n};
}

function coachLine(ev,q){
  if(ev.total>=80) return "这题比较完整，我基本能判断你的能力边界了。";
  if(ev.dims.evidence<10) return "方向对，但全是定性描述。补一个数字，我才知道这件事的量级。";
  if(ev.dims.structure<10) return "信息有点散。你按「当时的问题 → 你的动作 → 结果」再讲一遍。";
  if(ev.dims.content<10) return "你讲的例子和这个岗位的关联不够，换一个更贴近「"+(q?q.tag:"这道题")+"」的例子。";
  if(ev.dims.expression<10) return "我抓不到重点。先说结论，再补两句过程就行。";
  return "嗯，我理解了。";
}

function startSession(mode){
  const job = activeJob(), res = activeResume();
  if(!job || !res){ toast("先录入岗位和简历"); return; }
  const plan = buildQuestionPlan(job,res);
  const s = {
    id: uid("iv"), jobId: job.id, resumeId: res.id, mode: mode||ivMode,
    plan, qi:0, turns:[], answers:[], reverseText:"", done:false, drillResult:null, startedAt: nowISO()
  };
  if(s.mode==="dialog"){
    s.turns.push({who:"ai",tag:"面试官",text:`你好，我是${job.company}这轮面试的面试官。我们大概聊 20 分钟，中间我会追问细节，你按真实情况说就行。`});
    s.turns.push({who:"ai",tag:plan[0].tag,text:plan[0].text});
  }
  data.interview = s;
  store.save(); render();
}

function submitAnswer(text, drill){
  const s = data.interview;
  if(!s || s.done) return;
  const t = String(text||"").trim();
  if(!t){ toast("先写点内容，哪怕只写三句话"); return; }
  const job = getJob(s.jobId), res = getResume(s.resumeId);
  const q = s.plan[s.qi] || {tag:"收尾",text:""};
  const ev = evaluateAnswer(t,q,job,res);

  if(drill){
    s.answers.push({qid:q.id,q:q.text,tag:q.tag,text:t,ev});
    s.drillResult = {qid:q.id,ev};
    store.save(); render();
    return;
  }

  s.turns.push({who:"me",text:t,tag:"我"});
  if(q.reverse){
    s.reverseText = t;
    s.turns.push({who:"ai",tag:"面试官",text:"好，我记下了。这些问题我会在后续流程里回复你。今天就到这里，我给你一份答辩评估。"});
    finishSession();
    return;
  }
  s.answers.push({qid:q.id,q:q.text,tag:q.tag,text:t,ev});
  s.turns.push({who:"fb",tag:`评分 ${ev.total} / 100`,text:coachLine(ev,q)+(ev.tips.length?"\n建议："+ev.tips.slice(0,2).join(" "):"")});
  s.qi++;
  if(s.qi>=s.plan.length){ finishSession(); return; }
  const nq = s.plan[s.qi];
  s.turns.push({who:"ai",tag:nq.tag,text:nq.text});
  store.save();
  renderInterviewDialog(s, job, res);
  const input = $("#iv-input"); if(input) input.value="";
}

function advanceDrill(){
  const s = data.interview;
  if(!s) return;
  s.qi++; s.drillResult = null;
  if(s.qi>=s.plan.length){ finishSession(); return; }
  store.save(); render();
}

function skipQuestion(){
  const s = data.interview;
  if(!s) return;
  const q = s.plan[s.qi];
  if(q && q.reverse){ finishSession(); return; }
  if(s.mode==="drill"){
    s.qi++; s.drillResult = null;
    if(s.qi>=s.plan.length){ finishSession(); return; }
    store.save(); render(); return;
  }
  s.turns.push({who:"ai",tag:"面试官",text:"好，那我换个角度问。"});
  s.qi++;
  if(s.qi>=s.plan.length){ finishSession(); return; }
  const nq = s.plan[s.qi];
  s.turns.push({who:"ai",tag:nq.tag,text:nq.text});
  store.save(); render();
}

function finishSession(){
  const s = data.interview;
  if(!s || s.done) return;
  const job = getJob(s.jobId), res = getResume(s.resumeId);
  const ans = (s.answers||[]).filter(a=>a.ev);
  if(!ans.length){
    data.interview = null; store.save();
    toast("本场还没有作答，已退出"); render(); return;
  }
  const dims = {};
  DIM_KEYS.forEach(k=>{ dims[k] = Math.round(ans.reduce((x,a)=>x+a.ev.dims[k],0)/ans.length); });
  const total = Math.round((dims.content*.35 + dims.structure*.25 + dims.evidence*.25 + dims.expression*.15)/25*100);
  const tips = [];
  ans.forEach(a=>{ (a.ev.tips||[]).forEach(t=>{ if(tips.indexOf(t)<0) tips.push(t); }); });
  const rec = {
    id: s.id, jobId: s.jobId, resumeId: s.resumeId,
    jobTitle: `${job?job.company:"—"} · ${job?job.title:"模拟面试"}`,
    mode: s.mode, startedAt: s.startedAt, finishedAt: nowISO(),
    total, dims, tips: tips.slice(0,5), reverseText: s.reverseText||"",
    qa: ans.map(a=>({q:a.q,tag:a.tag,text:a.text,ev:a.ev}))
  };
  data.sessions = data.sessions || [];
  data.sessions.push(rec);
  s.done = true; s.sessionId = rec.id;
  store.save(); render();
}

function buildReportText(rec){
  const lines = [`模拟面试答辩 · ${rec.jobTitle}`, `时间：${rec.finishedAt}`, `总分：${rec.total} / 100`];
  lines.push(`四维：内容 ${rec.dims.content}/25 · 结构 ${rec.dims.structure}/25 · 证据 ${rec.dims.evidence}/25 · 表达 ${rec.dims.expression}/25`);
  lines.push("");
  (rec.qa||[]).forEach((a,i)=>{
    lines.push(`Q${i+1}（${a.tag}）${a.q}`);
    lines.push(`我的回答：${a.text}`);
    lines.push(`得分：${a.ev.total}`);
    lines.push("");
  });
  if((rec.tips||[]).length){ lines.push("改进项："); rec.tips.forEach(t=>lines.push("- "+t)); }
  return lines.join("\n");
}

      <div class="split mt18">
        <div class="panel-lg">
          <h4>${icon("alert",16)} 答辩结论</h4>
          <div class="ph-sub">按优先级排序，逐条改，不要一次改所有问题</div>
          ${tipRows || `<div class="tiny">本场没有触发明显问题，保持节奏，去练压力面。</div>`}
        </div>
        <div class="panel-lg">
          <h4>${icon("help",16)} 下一步</h4>
          <div class="ph-sub">把结论落成动作，下一场才不会再犯</div>
          <div class="flex mt8 wrap">
            <button class="btn sm" id="rp-reverse">${icon("help",14)} 生成反问清单</button>
            <button class="btn line sm" id="rp-match">${icon("target",14)} 回看匹配缺口</button>
            <button class="btn line sm" id="rp-todo">${icon("list",14)} 全部加入复盘待办</button>
          </div>
          ${rec.reverseText?`<div class="mt12"><div class="tiny" style="font-weight:800">你在反问环节问的是：</div>
            <div class="diff-cell mt8" style="white-space:pre-wrap">${esc(rec.reverseText)}</div></div>`:""}
        </div>
      </div>
      ${qaRows}`;
  wireReport(rec);
}

function wireReport(rec){
  const cp = $("#rp-copy"); if(cp) cp.onclick = ()=>copyText(buildReportText(rec));
  const ag = $("#rp-again"); if(ag) ag.onclick = ()=>startSession(rec.mode);
  const rv = $("#rp-reverse"); if(rv) rv.onclick = ()=>go("reverse");
  const mt = $("#rp-match"); if(mt) mt.onclick = ()=>go("match");
  $("#screen").querySelectorAll(".js-tip-todo").forEach(b=>b.onclick=()=>{
    addTodo(rec.tips[+b.dataset.i], "P0");
    b.textContent = "已加入"; b.disabled = true;
  });
  const all = $("#rp-todo");
  if(all) all.onclick = ()=>{ (rec.tips||[]).forEach(t=>addTodo(t,"P1")); toast("已全部加入复盘待办"); };
}

function addTodo(text, p){
  const t = String(text||"").trim();
  if(!t) return;
  data.todo = data.todo || [];
  data.todo.unshift({id: Date.now()+Math.floor(Math.random()*1000), title: t.slice(0,90), priority: p||"P1", done:false, note:"来自模拟面试答辩"});
  store.save();
}

/* ============================================================
   JOBSEARCH · 反问助手
   ============================================================ */
function shortText(s,n){ const t=String(s||"").replace(/^[\d.、]+/,"").trim(); return t.length>(n||36)?t.slice(0,n||36)+"…":t; }

function buildReverseQuestions(job,res,m){
  const parsed = (job&&job.parsed) || parseJD(job&&job.jd) || {};
  const missing = (m&&m.missing)||[];
  const duties = parsed.duties||[];
  const groups = [];

  const g1 = {tag:"岗位与目标",items:[
    {q:"这个岗位现在最想解决的一个业务问题是什么？如果前三个月只能做成一件事，您希望是哪件？",why:"把 JD 的职责清单变成具体目标，同时能听出这个岗位是长期需求还是临时救火。",risk:""},
    {q:"这个岗位是新增编制还是补位？上一任在这块做到什么程度？",why:"新增通常意味着有预算和资源；补位要判断接手的是不是烂摊子。",risk:"对方含糊其辞，说明岗位定位可能还没想清楚。"}
  ]};
  if(duties[0]) g1.items.push({q:`JD 里提到「${shortText(duties[0])}」，这块目前的现状是什么？最大的阻力在哪？`,why:"证明你认真读过 JD，也在预判自己入职后的真实工作场景。",risk:""});
  groups.push(g1);

  groups.push({tag:"团队与协作",items:[
    {q:"团队现在的分工是怎样的？这个岗位日常要和哪些角色配合最多？",why:"判断你是独立作战还是强协作，也顺便确认团队是否缺人缺得厉害。",risk:""},
    {q:"这个岗位的直接汇报对象是谁？他更看重结果还是过程？",why:"汇报关系决定你的工作方式和考核口径，比薪资更影响日常体验。",risk:""}
  ]});

  groups.push({tag:"业务与决策",items:[
    {q:"像我在简历里做的这类分析（或项目），在贵司通常由谁拍板落地？从结论到执行大概要多久？",why:"判断你的工作能不能真正产生影响，还是只输出报告没人用。",risk:"如果对方答不出流程，说明决策链可能很随意。"},
    {q:"这个岗位做得好不好，半年后会用哪些指标来衡量？",why:"提前知道考核标准，面试时就能把自己的经历往这个标准上靠。",risk:""}
  ]});

  if(missing.length){
    const g = {tag:"针对你的缺口提问（加分项）",items:missing.slice(0,3).map(it=>({
      q:`JD 要求「${shortText(it.text,30)}」。团队目前在这块的成熟度如何？是希望我从 0 搭，还是接手现有体系？`,
      why:"既不回避自己的缺口，又把问题转成对工作内容的确认，比硬解释更加分。",
      risk:"问之前先用一句话承认自己的差距，再问，否则容易被听成抬杠。"
    }))};
    groups.push(g);
  }

  const years = (m&&m.yOwn)||0;
  groups.push({tag:"成长与评估",items:[
    {q:"如果我入职，您建议我第一个月先补哪一块能力，能最快跟上团队节奏？",why:"把面试收尾变成一次免费辅导，也传递出你愿意补短板的信号。",risk:""},
    {q:`我有 ${years} 年经验，您觉得我从现在这个阶段往下一阶段走，最缺的是什么？`,why:"借面试官的经验做一次职业诊断，这类问题通常会被认真回答。",risk:""}
  ]});

  groups.push({tag:"收尾一句",items:[
    {q:"今天聊完，您对我还有哪方面的顾虑？如果有，我希望现在就能补充说明。",why:"直接把面试官心里的疑问摆到桌面上，很多顾虑当场就能化解。",risk:"问完要真的准备好回答，不要问完就沉默。"},
    {q:"后续流程大概什么时候会有反馈？我需要补什么材料可以提前准备。",why:"显得你有节奏感，也能避免无限等待。",risk:""}
  ]});
  return groups;
}

const REVERSE_AVOID = [
  {bad:"你们加班多吗？",good:"团队在项目高峰期的节奏一般怎么安排？",why:"直接问加班会被理解成抗拒投入；问节奏是在了解工作方式。"},
  {bad:"工资能给多少？",good:"这个岗位的薪资区间和晋升节奏大概是怎样的？",why:"技术面问钱容易减分，这类问题留到 HR 环节或 offer 阶段更合适。"},
  {bad:"我可以远程办公吗？",good:"团队日常协作以现场为主，还是有固定的远程日？",why:"问制度而不是问特权，听起来更像在关心协作效率。"},
  {bad:"公司未来会上市吗？",good:"公司未来一年的业务重点在哪块？这个岗位在其中承担什么？",why:"宏大叙事对你没有直接价值，业务重点才决定你做什么。"},
  {bad:"我刚才表现得怎么样？",good:"如果我有机会加入，您建议我入职前先补哪一块？",why:"当场要评价会让面试官为难，换成求建议就变成加分项。"}
];

function allReverseItems(job,res,m){
  const groups = buildReverseQuestions(job,res,m);
  const extra = ((data.reverse&&data.reverse.extra)||[]).map(x=>({q:x.q,why:x.why,risk:x.risk,ai:true}));
  if(extra.length) groups.push({tag:"AI 补充（来自提示词工坊）",items:extra});
  return groups;
}

function renderReverse(){
  const job = activeJob(), res = activeResume();
  if(!job || !res){
    $("#screen").innerHTML = headHTML("反问助手","面试最后五分钟，往往决定面试官对你的印象")
      + emptyState("help","还缺岗位和简历","反问要贴着岗位问，先把 JD 和简历录进来。","去录入岗位","go-jobs");
    $("#screen").querySelectorAll("[data-act='go-jobs']").forEach(el=>el.onclick=()=>go("jobs"));
    return;
  }
  const m = runMatch(job.id,res.id);
  const groups = allReverseItems(job,res,m);
  const count = groups.reduce((s,g)=>s+(g.items||[]).length,0);

  $("#screen").innerHTML = headHTML("反问助手",`${job.company} · ${job.title} · ${count} 个可选问题`,
      `<button class="btn line sm" id="rq-copy">全部复制</button>
       <button class="btn line sm" id="rq-print">打印</button>
       <button class="btn sm" id="rq-ai">${icon("spark",14)} AI 生成</button>`)
    + `<div class="alert info">${icon("alert",14)} <b>反问不是客套。</b>面试官问“你还有什么想问的”，是在看你有没有判断力。优先问「岗位要解决什么、团队怎么协作、怎么衡量我的产出」，把薪资和加班留到 HR 环节。</div>
      ${(data.reverse&&data.reverse.extra||[]).length?`<div class="alert warn mt12">${icon("alert",14)} AI 补充了 ${data.reverse.extra.length} 条，已合并到下方列表。</div>`:""}
      <div class="split mt18">
        ${groups.map((g,gi)=>`<div class="panel-lg">
          <h4>${icon("help",16)} ${esc(g.tag)}</h4>
          <div class="ph-sub">${gi===0?"优先问，能最快判断岗位是否值得去":gi===3?"带着缺口问，反而显得坦诚":"按现场气氛挑 2–3 个问即可"}</div>
          ${(g.items||[]).map((it,i)=>`<div class="rq-card mt12">
            <div class="rq">${esc(it.q)}</div>
            <div class="why">${esc(it.why||"")}</div>
            ${it.risk?`<div class="risk">注意：${esc(it.risk)}</div>`:""}
            <div class="rf">
              <button class="btn ghost sm js-rq-copy" data-g="${gi}" data-i="${i}">复制问题</button>
              <button class="btn ghost sm js-rq-todo" data-g="${gi}" data-i="${i}">加入待办</button>
              ${it.ai?'<span class="badge demo">AI</span>':""}
            </div>
          </div>`).join("")}
        </div>`).join("")}
      </div>
      <div class="panel-lg mt18">
        <h4>${icon("alert",16)} 别这样问</h4>
        <div class="ph-sub">同样的问题，换个问法，分数完全不同</div>
        <div class="avoid-list mt12">
          ${REVERSE_AVOID.map(a=>`<div class="avoid-item"><b>不要说：</b>${esc(a.bad)}<br/>
            <b>可以这样问：</b>${esc(a.good)}<br/>${esc(a.why)}</div>`).join("")}
        </div>
      </div>`;
  wireReverse(groups);
}

function wireReverse(groups){
  $("#screen").querySelectorAll(".js-rq-copy").forEach(b=>b.onclick=()=>{
    const it = groups[+b.dataset.g].items[+b.dataset.i]; if(it) copyText(it.q);
  });
  $("#screen").querySelectorAll(".js-rq-todo").forEach(b=>b.onclick=()=>{
    const it = groups[+b.dataset.g].items[+b.dataset.i];
    if(it){ addTodo("面试反问：" + it.q, "P2"); b.textContent = "已加入"; b.disabled = true; }
  });
  const cp = $("#rq-copy");
  if(cp) cp.onclick = ()=>{
    const lines = [];
    groups.forEach(g=>{ lines.push("【"+g.tag+"】"); (g.items||[]).forEach((it,i)=>lines.push(`${i+1}. ${it.q}`)); lines.push(""); });
    copyText(lines.join("\n"));
  };
  const pr = $("#rq-print"); if(pr) pr.onclick = ()=>window.print();
  const ai = $("#rq-ai"); if(ai) ai.onclick = ()=>openPromptStudio("reverse_questions");
}

/* ============================================================
   JOBSEARCH · 首次运行整形
   ============================================================ */
function ensureShape(){
  data.jobs = data.jobs || [];
  data.resumes = data.resumes || [];
  data.sessions = data.sessions || [];
  data.todo = data.todo || [];
  data.note = data.note || [];
  data.settings = Object.assign({ engine:"local", baseUrl:"https://api.openai.com/v1", apiKey:"", model:"gpt-4o-mini" }, data.settings||{});
  data.reverse = Object.assign({ extra:[] }, data.reverse||{});
  if(!data.jobs.length){
    const j = demoJob(); j.demo = true; j.parsed = parseJD(j.jd); data.jobs.push(j);
  }
  if(!data.resumes.length){
    const r = demoResume(); r.demo = true; data.resumes.push(r);
  }
  if(!data.activeJobId) data.activeJobId = (data.jobs[0]||{}).id || null;
  if(!data.activeResumeId) data.activeResumeId = (data.resumes[0]||{}).id || null;
  store.save();
}

/* __JOBSEARCH_BLOCK__ */
ensureShape();
buildNav();
render();
wireDrawer();
maybePrivacyIntro();
wechatTip();
</script>
